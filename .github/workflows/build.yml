# 推送到 main、提 PR 时：跑测试 + 打包，Windows exe 和安卓 APK 作为构建产物（Actions 页面可下载）
# 推送 v* 标签时：再自动创建 GitHub Release 并上传 exe 和 APK
#   发版：改 backend.py 里的 APP_VERSION（安卓端也读它）→ 提交 → git tag v2.3.4 → git push origin v2.3.4
name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 读取版本号
        id: version
        run: |
          $m = Select-String -Path backend.py -Pattern '^APP_VERSION = "(.+)"'
          if (-not $m) { throw 'backend.py 里找不到 APP_VERSION' }
          $ver = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "标签 $env:GITHUB_REF_NAME 和 backend.py 里的 APP_VERSION（$ver）不一致"
          }
          "version=$ver" >> $env:GITHUB_OUTPUT

      # build.ps1 看到 .venv 已存在就不再装依赖
      - name: 安装依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: 测试
        run: .\.venv\Scripts\python.exe -m unittest tests.test_portal tests.test_backend tests.test_logfiles tests.test_transfer

      # GitHub 会把 Release 附件名里的中文替换掉，所以改成英文文件名
      - name: 打包
        run: |
          .\build.ps1
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Move-Item $exe.FullName "dist\Xiaoyuan-v${{ steps.version.outputs.version }}-win-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: Xiaoyuan-v${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 运行器自带 Android SDK，补上这个项目用的平台和 NDK（NDK 只用来编译保活守护 guardd.c）
      - name: 安装 SDK 组件
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      # 发布版用作者本机的调试签名（和作者手机上装的一致，才能覆盖升级），签名文件以 base64 放在仓库 Secret DEBUG_KEYSTORE。
      # 用 ANDROID_USER_HOME 指定签名文件所在目录（运行器上默认找的不是 ~/.android）。
      # 没有这个 Secret（比如别人提的 PR）就用临时生成的，只是装不到已安装的版本上；发版时必须有
      - name: 准备签名
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$RUNNER_TEMP/android"
            echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/android/debug.keystore"
            echo "ANDROID_USER_HOME=$RUNNER_TEMP/android" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::发版需要仓库 Secret DEBUG_KEYSTORE（签名文件）"
            exit 1
          fi

      # 协议测试要用 tests/mock_portal.py 起假门户
      - name: 测试并打包
        working-directory: android
        env:
          PYTHON: python3
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      # APK 的签名证书要和签名文件里的一样，不一样（没用上）就失败，免得发出装不上的包
      - name: 检查签名
        if: env.ANDROID_USER_HOME != ''
        run: |
          want=$(keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          got=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "签名文件 $want"
          echo "APK      $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::APK 的签名和签名文件不一致"
            exit 1
          fi

      - name: 改名
        id: apk
        run: |
          ver=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend.py)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Xiaoyuan-v$ver-android.apk"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: Xiaoyuan-v${{ steps.apk.outputs.version }}-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Xiaoyuan-v${{ needs.build.outputs.version }}*
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exe=$(ls dist/*.exe)
          apk=$(ls dist/*.apk)
          notes=$(printf '%s\n' \
            "- Windows 10/11 64 位：\`$(basename "$exe")\`，下载后直接运行" \
            "- Android 8.0 及以上：\`$(basename "$apk")\`" \
            "" \
            "SHA256：" \
            "- \`$(sha256sum "$exe" | cut -d' ' -f1)\`  $(basename "$exe")" \
            "- \`$(sha256sum "$apk" | cut -d' ' -f1)\`  $(basename "$apk")")
          gh release create "$GITHUB_REF_NAME" "$exe" "$apk" \
            --title "校园网登录 $GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes
